<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kuya Jukebox · live console</title>
<style>
/* Google Sans (SIL OFL 1.1, see fonts/OFL.txt), self-hosted, Latin subset, variable weight 400-700 */
@font-face{font-family:"Google Sans";src:url("fonts/GoogleSans-var-latin.woff2") format("woff2");font-weight:400 700;font-style:normal;font-display:swap}

:root{
  --bg1:#160709; --bg2:#2a0d12; --surface:transparent; --surface2:#2e141c; --line:#4a2530;
  --text:#fdf1e3; --muted:#c9a99b;
  --amber:#ffc15e; --coral:#ff7a66; --red:#ff4d5e; --cyan:#7fe3f0; --pink:#ff8ad8;
  --good:#8de8b8; --miss:#ff9b8a; --border:0px;
  --font:"Google Sans","Google Sans Flex",system-ui,"Segoe UI",sans-serif;
  /* golden-ratio type scale, base 1rem (steps of φ and √φ) */
  --t-2:.62rem; --t-1:.79rem; --t0:1rem; --t1:1.27rem; --t2:1.62rem; --t3:2.06rem; --t4:2.62rem; --t5:4.24rem;
}
:root.hc{--bg1:#000;--bg2:#000;--surface2:#1c0d11;--line:#fdf1e3;--text:#fff;--muted:#f1e3d6}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:max(11px,min(1.25vw,2.222vh))}   /* 1rem = 16px at 1280x720, 24px at 1920x1080 */
body{margin:0;height:100vh;overflow:hidden;font-family:var(--font);font-size:var(--t0);color:var(--text);
  background:radial-gradient(ellipse at 30% 45%,var(--bg2) 0%,var(--bg1) 70%) var(--bg1);display:flex;flex-direction:column}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:.8rem;padding:1.2rem 2rem .8rem;flex:0 0 auto}
.brand{display:flex;flex-direction:column;line-height:1.05;margin-right:auto}
.brand b{font-size:var(--t2);font-weight:700;color:var(--amber)}
.brand span{font-size:var(--t-1);color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:.4rem;padding:.25rem .8rem;border-radius:99px;background:var(--surface2);font-weight:700;font-size:var(--t0);letter-spacing:.04em;white-space:nowrap}
.pill i{width:.62rem;height:.62rem;border-radius:50%;background:var(--muted)}
.pill[data-k=live]{color:var(--good)} .pill[data-k=live] i{background:var(--good)}
.pill[data-k=reconnecting]{color:var(--amber)} .pill[data-k=reconnecting] i{background:var(--amber)}
.pill[data-k=replay]{color:var(--cyan)} .pill[data-k=replay] i{background:var(--cyan)}
.pill[data-k=waiting]{color:var(--muted)}
.hostbox{display:flex;align-items:center;gap:.4rem;font-size:var(--t-1);color:var(--muted)}
.hostbox input{width:10.5rem;background:var(--surface2);border:0;border-radius:.5rem;padding:.25rem .5rem;font-size:var(--t-1)}
.btn{background:var(--surface2);border:0;border-radius:.6rem;padding:.3rem .7rem;font-size:var(--t-1);font-weight:500}
.btn:hover{background:#43212c}
.btn[aria-pressed=true]{background:rgba(127,227,240,.18);color:var(--cyan)}
main{flex:1 1 0;min-height:0;padding:0 2rem 1.6rem;display:flex}
.view{flex:1 1 auto;min-width:0;min-height:0;display:grid;gap:1.8rem}
.card{background:none;border:0;padding:.7rem .85rem;min-height:0}
.card h2{margin:0 0 .4rem;font-size:var(--t-1);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.src{font-size:var(--t-1);color:var(--muted);line-height:1.3;margin:.35rem 0 0}

/* ---------- STAGE view: φ : 1 columns, jukebox about 0.618 of the height ---------- */
#vStage{grid-template-columns:minmax(0,1.618fr) minmax(0,1fr)}
.left{display:flex;flex-direction:column;min-height:0}
.left .heroCard{flex:1 1 0}
.heroCard{position:relative;display:flex;justify-content:center;padding:.3rem .6rem;overflow:hidden;background:radial-gradient(ellipse at 50% 55%,#33111a 0%,rgba(36,16,22,0) 72%)}
:root.hc .heroCard{background:none}
.hero{position:relative;height:100%;min-height:0;display:flex;justify-content:center;width:100%}
.halo{position:absolute;inset:4% 12% 10%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,77,94,.5),rgba(255,122,102,.18) 55%,transparent 75%);opacity:.75;pointer-events:none}
.hero svg{position:relative;height:100%;width:auto;max-width:100%;overflow:visible}
.stateLabel{position:absolute;left:0;right:0;bottom:.5rem;display:flex;flex-direction:column;align-items:center;text-align:center;pointer-events:none}
.stateLabel b{font-size:var(--t4);font-weight:700;display:flex;align-items:center;gap:.6rem;line-height:1.05;text-shadow:0 0 .8rem #000,0 0 .3rem #000}
.stateLabel b em{font-style:normal;font-size:var(--t3);color:var(--amber)}
.stateLabel span{font-size:var(--t1);color:var(--text);min-height:1.4rem;text-shadow:0 0 .6rem #000}
.hero-badge{position:absolute;top:.7rem;left:.8rem;z-index:2;display:inline-flex;align-items:center;gap:.4rem;font-size:var(--t-2);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--cyan);background:rgba(127,227,240,.12);border-radius:99px;padding:.2rem .7rem}
.hero-badge::before{content:"";width:.45rem;height:.45rem;border-radius:50%;background:var(--cyan)}
.previewRow{position:absolute;top:.7rem;right:.8rem;z-index:2;display:flex;flex-direction:column;gap:.1rem;align-items:stretch;min-width:9.5rem;padding:.4rem;border-radius:.9rem;background:rgba(22,7,9,.72);backdrop-filter:blur(6px)}
.previewRow .pt{font-size:var(--t-2);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:.1rem .5rem .3rem}
.pbtn{display:flex;align-items:center;gap:.55rem;width:100%;text-align:left;background:transparent;border:0;border-radius:.6rem;padding:.28rem .55rem;font-size:var(--t-1);font-weight:500;color:var(--text)}
.pbtn i{font-style:normal;width:1.1em;text-align:center;color:var(--muted)}
.pbtn:hover{background:rgba(255,255,255,.07)}
.pbtn[aria-pressed=true]{background:rgba(255,193,94,.18);color:var(--amber);font-weight:700}
.pbtn[aria-pressed=true] i{color:var(--amber)}
.pbtn.fx{margin-top:.25rem;border-top:1px solid rgba(255,255,255,.08);border-radius:0 0 .6rem .6rem;padding-top:.4rem;color:var(--coral)}
.pbtn.fx i{color:var(--coral)}

/* latency tiles */

/* ---------- chat ---------- */
.chatCard{display:flex;flex-direction:column;padding:.4rem 1rem .8rem}
.chatHead{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.8rem}
.chatHead h2{margin:0}
#feed{list-style:none;margin:0;padding:0 .4rem 0 0;flex:1 1 0;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:1rem;scrollbar-color:#4a2530 transparent}
.turn{display:flex;flex-direction:column;gap:.45rem}
.turnH{align-self:center;font-size:var(--t-2);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.row{font-size:.9rem;line-height:1.45}
.msg{overflow-wrap:anywhere;max-width:86%;padding:.6rem .85rem .65rem;border-radius:1.1rem}
.msg .who{display:block;font-size:var(--t-2);font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:.15rem}
.msg.user{align-self:flex-start;background:var(--surface2);color:var(--text);border-bottom-left-radius:.3rem}
.msg.user .who{color:var(--cyan)}
.msg.agent{align-self:flex-end;background:rgba(255,193,94,.17);color:var(--text);border-bottom-right-radius:.3rem}
.msg.agent .who{color:var(--amber)}
.chips{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.45rem}
.chip{font-size:var(--t-2);font-weight:500;border-radius:99px;padding:.05rem .5rem;background:rgba(0,0,0,.3);white-space:nowrap;color:var(--muted)}
.chip b{font-weight:700}
.evt{align-self:center;font-size:var(--t-1);color:var(--muted);display:flex;align-items:baseline;justify-content:center;gap:.4rem;flex-wrap:wrap;text-align:center}
.evt .ic{font-style:normal;color:var(--amber)}
.evt.tool b{color:var(--amber);font-weight:700}
.evt.int,.evt.int .ic{color:var(--coral)}
.evt.guard{color:var(--amber)}
.evt .q{color:var(--text)}
.spin{display:inline-block;width:.8em;height:.8em;border:2px solid var(--amber);border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
.empty{margin:auto;text-align:center;color:var(--muted);max-width:22rem;padding:1rem}
.empty b{display:block;font-size:var(--t1);color:var(--text);margin-bottom:.4rem;font-weight:500}
.empty span{font-size:var(--t-1);line-height:1.5}
/* ---------- hero svg paint ---------- */
.tube-out{fill:none;stroke:url(#gOut);stroke-width:26}
.tube-in{fill:none;stroke:#ffc15e;stroke-width:18}
.tube-core{fill:none;stroke:#fff3dc;stroke-width:6;opacity:.9}
.glowL{fill:none}
.glow{opacity:.65}
.ripple{fill:none;stroke:#ff7a66;stroke-width:26;opacity:0;transform-origin:200px 340px}
.dial{transform-origin:200px 215px}
.chase,.chaseT{offset-path:path("M68,470 V215 A132 132 0 0 1 332 215 V470");offset-distance:0%;opacity:0;fill:#fff3dc}
.wv rect{fill:#ffb347;transform-box:fill-box;transform-origin:50% 100%;opacity:0}
.eq rect{fill:#fff3dc;transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(.18)}
.flashfx{opacity:0;pointer-events:none}
.svgwrap{transform-origin:50% 60%}

@keyframes breathe{0%,100%{opacity:.45}50%{opacity:.95}}
@keyframes ripple{0%{opacity:.75;transform:scale(1)}100%{opacity:0;transform:scale(1.1)}}
@keyframes wave{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes eqb{0%,100%{transform:scaleY(.15)}50%{transform:scaleY(1)}}
@keyframes chase{to{offset-distance:100%}}
@keyframes hue{to{filter:hue-rotate(360deg)}}
@keyframes flash{0%{opacity:0}18%{opacity:.95}100%{opacity:0}}
@keyframes settle{0%{transform:scale(1.035)}100%{transform:scale(1)}}
@keyframes glowflick{0%,100%{opacity:.45}50%{opacity:.75}}

[data-state=idle] .glow{animation:breathe 5s ease-in-out infinite}
[data-state=listening] .glow{opacity:1}
[data-state=listening] .ripple{animation:ripple 1.8s ease-out infinite}
[data-state=listening] .ripple.r2{animation-delay:.9s}
[data-state=listening] .wv rect{opacity:1;animation:wave .9s ease-in-out infinite;animation-delay:var(--d)}
[data-state=thinking] .dial{animation:spin 6s linear infinite}
[data-state=thinking] .glow{animation:glowflick 2.4s ease-in-out infinite}
[data-state=speaking] .glow{opacity:1}
[data-state=speaking] .eq rect{animation:eqb .7s ease-in-out infinite;animation-delay:var(--d)}
[data-state=tool] .glow{opacity:.85}
[data-state=tool] .chase{opacity:1;animation:chase 1.6s linear infinite}
[data-state=tool] .chaseT.t1{opacity:.55;animation:chase 1.6s linear infinite;animation-delay:-.1s}
[data-state=tool] .chaseT.t2{opacity:.3;animation:chase 1.6s linear infinite;animation-delay:-.2s}
[data-state=music] .glow{opacity:.95}
[data-state=music] .panelL,[data-state=music] .panelU{animation:hue 7s linear infinite}
[data-state=music] .panelR{animation:hue 7s linear infinite;animation-delay:-3.5s}
[data-state=music] .eq rect{animation:eqb 1.3s ease-in-out infinite;animation-delay:var(--d)}
.flash .flashfx{animation:flash .75s ease-out 1}
.flash .svgwrap{animation:settle .75s ease-out 1}

/* reduced motion: no movement; the state is carried by a static look plus the text label */
:root.reduce *{animation:none!important;transition:none!important}
:root.reduce [data-state=idle] .glow{opacity:.55}
:root.reduce [data-state=listening] .ripple.r1{opacity:.45;transform:scale(1.05)}
:root.reduce [data-state=listening] .wv rect{opacity:1;transform:scaleY(.6)}
:root.reduce [data-state=thinking] .dial{transform:rotate(22deg)}
:root.reduce [data-state=thinking] .glow{opacity:.4}
:root.reduce [data-state=speaking] .eq rect{transform:scaleY(.7)}
:root.reduce [data-state=speaking] .eq rect:nth-child(2n){transform:scaleY(.4)}
:root.reduce [data-state=tool] .chase{opacity:1;offset-distance:50%}
:root.reduce [data-state=music] .panelL,:root.reduce [data-state=music] .panelU{filter:hue-rotate(140deg)}
:root.reduce [data-state=music] .panelR{filter:hue-rotate(250deg)}
:root.reduce [data-state=music] .eq rect{transform:scaleY(.55)}

/* ---------- narrow / laptop portrait ---------- */
@media (max-width:900px){
  html{font-size:15px} body{height:auto;overflow:auto}
  main{display:block} .view{display:flex;flex-direction:column}
  .left{display:flex;flex-direction:column} .heroCard{height:28rem} .chatCard{min-height:30rem}
  header{flex-wrap:wrap} .brow{grid-template-columns:1fr 5rem 5rem} .brow .track{grid-column:1 / -1;order:5}
  .strip{display:flex;flex-direction:column}
}
</style>
</head>
<body>
<header>
  <div class="brand"><b>Kuya Jukebox</b><span>full-duplex voice agent · Raspberry Pi 4</span></div>
</header>

<main>
  <!-- =================== STAGE =================== -->
  <div class="view" id="vStage">
    <section class="left" aria-label="Agent state and latency">
      <div class="card heroCard">
        <div class="previewRow" id="previewRow" hidden></div>
        <div class="hero" id="hero" data-state="idle">
          <div class="halo"></div>
          <svg viewBox="0 0 400 650" role="img" aria-label="Neon jukebox that shows what the agent is doing" preserveAspectRatio="xMidYMid meet">
            <defs>
              <linearGradient id="gOut" gradientUnits="userSpaceOnUse" x1="0" y1="60" x2="0" y2="480"><stop offset="0" stop-color="#ff7a66"/><stop offset=".55" stop-color="#ff9a5e"/><stop offset="1" stop-color="#ffb35c"/></linearGradient>
              <linearGradient id="gChrome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9dfe0"/><stop offset=".45" stop-color="#7d6a70"/><stop offset=".6" stop-color="#3a2a30"/><stop offset="1" stop-color="#b9a9ae"/></linearGradient>
              <linearGradient id="gBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a0f15"/><stop offset="1" stop-color="#14070a"/></linearGradient>
              <radialGradient id="gDome" cx=".5" cy="1" r="1"><stop offset="0" stop-color="#ffd28a"/><stop offset=".6" stop-color="#d98a3d"/><stop offset="1" stop-color="#8a4a22"/></radialGradient>
              <linearGradient id="gCyan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bff4fb"/><stop offset="1" stop-color="#6bd3e6"/></linearGradient>
              <linearGradient id="gPink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb0e6"/><stop offset="1" stop-color="#e86fc4"/></linearGradient>
              <radialGradient id="gFlash" cx=".5" cy=".45" r=".6"><stop offset="0" stop-color="#fff3dc"/><stop offset=".4" stop-color="#ff7a66"/><stop offset="1" stop-color="#ff7a66" stop-opacity="0"/></radialGradient>
              <linearGradient id="gFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".4"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
              <mask id="mRef" maskUnits="userSpaceOnUse" x="0" y="520" width="400" height="130"><rect x="0" y="520" width="400" height="130" fill="url(#gFade)"/></mask>
              <pattern id="pGrid" width="9" height="7" patternUnits="userSpaceOnUse"><rect width="9" height="7" fill="#f4ece4"/><path d="M0 .5H9M.5 0V7" stroke="#8d7d80" stroke-width="1"/></pattern>
              <pattern id="pGridA" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#ffc15e"/><path d="M0 .5H7M.5 0V7" stroke="#b86a22" stroke-width="1"/></pattern>
              <pattern id="pLat" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="#7a1822"/><path d="M0 0H14M0 0V14" stroke="#e07a6a" stroke-width="1.4"/></pattern>
              <clipPath id="cDome"><path d="M114,215 A86 86 0 0 1 286,215 Z"/></clipPath>
              <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
              <filter id="blurL" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="20"/></filter>
              <filter id="blurS" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
            </defs>
            <ellipse cx="200" cy="520" rx="170" ry="16" fill="#ff4d5e" opacity=".4" filter="url(#blur)"/>
            <!-- floor reflection of the whole jukebox (shares the animations of the original) -->
            <g mask="url(#mRef)"><use href="#jb" transform="translate(0,1030) scale(1,-1)"/></g>
            <g id="jb"><g class="svgwrap">
              <g class="glow">
                <g filter="url(#blurL)"><path class="glowL" d="M68,470 V215 A132 132 0 0 1 332 215 V470" stroke="#ff4d5e" stroke-width="52" opacity=".7"/></g>
                <g filter="url(#blur)">
                  <path class="glowL" d="M68,470 V215 A132 132 0 0 1 332 215 V470" stroke="#ff7a66" stroke-width="32"/>
                  <path class="glowL" d="M92,470 V215 A108 108 0 0 1 308 215 V470" stroke="#ffc15e" stroke-width="24"/>
                </g>
              </g>
              <path class="ripple r1" d="M68,470 V215 A132 132 0 0 1 332 215 V470"/>
              <path class="ripple r2" d="M68,470 V215 A132 132 0 0 1 332 215 V470"/>
              <g class="wv" id="wv"></g>
              <path d="M101,470 V215 A99 99 0 0 1 299 215 V470 Z" fill="url(#gBody)"/>
              <path d="M114,215 A86 86 0 0 1 286,215 Z" fill="url(#gDome)"/>
              <g clip-path="url(#cDome)"><g class="dial" id="dial"></g></g>
              <path d="M114,215 A86 86 0 0 1 286,215" fill="none" stroke="#3a2a30" stroke-width="4"/>
              <path class="tube-out" d="M68,470 V215 A132 132 0 0 1 332 215 V470"/>
              <path class="tube-in" d="M92,470 V215 A108 108 0 0 1 308 215 V470"/>
              <path class="tube-core" d="M92,470 V215 A108 108 0 0 1 308 215 V470"/>
              <path d="M172,92 L180,64 H220 L228,92 Z" fill="#ff4d5e"/>
              <path d="M166,96 L176,60 M234,96 L224,60" stroke="url(#gChrome)" stroke-width="6" stroke-linecap="round"/>
              <rect x="188" y="72" width="24" height="5" rx="2" fill="#ffd9d0" opacity=".7"/>
              <g fill="url(#gChrome)" stroke="#5a1f2a" stroke-width="1">
                <rect x="56" y="345" width="86" height="18" rx="3"/><rect x="258" y="345" width="86" height="18" rx="3"/>
                <rect x="56" y="440" width="86" height="12" rx="3"/><rect x="258" y="440" width="86" height="12" rx="3"/>
                <rect x="56" y="456" width="86" height="12" rx="3"/><rect x="258" y="456" width="86" height="12" rx="3"/>
              </g>
              <g fill="#ff6a5e" opacity=".8"><rect x="62" y="350" width="74" height="3"/><rect x="264" y="350" width="74" height="3"/><rect x="62" y="446" width="74" height="2"/><rect x="264" y="446" width="74" height="2"/></g>
              <rect x="106" y="215" width="188" height="48" rx="7" fill="#2a1b20" stroke="url(#gChrome)" stroke-width="4"/>
              <rect x="114" y="224" width="62" height="30" rx="3" fill="url(#pGrid)"/>
              <rect x="178" y="224" width="44" height="30" rx="3" fill="url(#pGridA)"/>
              <rect x="224" y="224" width="62" height="30" rx="3" fill="url(#pGrid)"/>
              <g class="panelL"><rect x="112" y="276" width="36" height="112" rx="7" fill="url(#gCyan)" opacity=".92"/><g class="eq" id="eqL"></g></g>
              <g class="panelR"><rect x="252" y="276" width="36" height="112" rx="7" fill="url(#gCyan)" opacity=".92"/><g class="eq" id="eqR"></g></g>
              <rect x="154" y="272" width="92" height="128" rx="6" fill="#2a1b20" stroke="url(#gChrome)" stroke-width="3"/>
              <rect x="160" y="280" width="80" height="112" rx="3" fill="url(#pLat)"/>
              <circle cx="200" cy="374" r="10" fill="#ff4d5e" stroke="#ffd9d0" stroke-width="2"/>
              <g class="panelU">
                <path d="M112,388 H148 V404 Q148,418 162,418 H238 Q252,418 252,404 V388 H288 V410 Q288,444 250,444 H150 Q112,444 112,410 Z" fill="url(#gPink)" opacity=".95"/>
                <g class="eq" id="eqU"></g>
              </g>
              <g fill="url(#gChrome)" stroke="#3a2a30"><rect x="56" y="470" width="86" height="38" rx="5"/><rect x="258" y="470" width="86" height="38" rx="5"/></g>
              <rect x="142" y="496" width="116" height="12" fill="#1a0a0e"/>
              <g filter="url(#blurS)"><circle class="chaseT t2" r="9"/><circle class="chaseT t1" r="9"/><circle class="chase" r="14"/></g>
              <circle class="chase" r="8" fill="#fff" stroke="#ff4d5e" stroke-width="3"/>
              <rect class="flashfx" x="-40" y="20" width="480" height="520" fill="url(#gFlash)"/>
            </g></g>
          </svg>
        </div>
        <div class="stateLabel" aria-live="polite"><b id="stText"><em id="stIcon">◌</em><span id="stWord">Idle</span></b><span id="stSub"></span></div>
      </div>

    </section>

    <section class="card chatCard" id="chatCard" aria-label="Conversation">
      <div class="chatHead"><h2 id="chatTitle">Live conversation</h2><span class="pill" id="chatSrc" data-k="waiting" style="font-size:var(--t-2);padding:.05rem .6rem">…</span></div>
      <ol id="feed" role="log" aria-live="polite" aria-label="Conversation events"></ol>
    </section>
  </div>

</main>

<script>
"use strict";
/* =====================================================================
   Constants. No benchmark or sample content lives in this file.
   Benchmark: fd-benchmark/runs/kuya-jukebox/2026-11-21_04-16-23/summary.md (tools OFF, class convention).
   ===================================================================== */
const STATE_UI = {
  idle:{w:"Idle", i:"◌", sub:"ready for you"}, listening:{w:"Listening", i:"●", sub:""},
  thinking:{w:"Thinking", i:"◐", sub:""}, speaking:{w:"Speaking", i:"♪", sub:""},
  tool:{w:"Calling a tool", i:"⚙", sub:""}, music:{w:"Playing music", i:"♫", sub:""}
};

/* ===================== helpers ===================== */
const $ = id => document.getElementById(id);
const SVGNS = "http://www.w3.org/2000/svg";
function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
function sv(tag, attrs, parent){ const e=document.createElementNS(SVGNS, tag); for(const k in attrs) e.setAttribute(k, attrs[k]); if(parent) parent.appendChild(e); return e; }
function store(k, v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } }
const sec = ms => (ms/1000).toFixed(2) + " s";
function median(a){ if(!a.length) return null; const s=[...a].sort((x,y)=>x-y), m=s.length>>1; return s.length%2? s[m] : (s[m-1]+s[m])/2; }

/* ===================== views ===================== */
const feed = $("feed");
let pinned = true;
function toBottom(){ if(pinned) feed.scrollTop = feed.scrollHeight; }
/* ===================== hero ===================== */
const hero = $("hero");
(function buildHero(){
  const dial = $("dial");
  for(let a=0;a<360;a+=15){ const r=a*Math.PI/180; sv("line",{x1:200,y1:215,x2:(200+86*Math.sin(r)).toFixed(1),y2:(215-86*Math.cos(r)).toFixed(1),stroke:"#7a3a1c","stroke-width":a%45===0?3:1.6}, dial); }
  sv("circle",{cx:200,cy:215,r:56,fill:"none",stroke:"#7a3a1c","stroke-width":2},dial);
  sv("circle",{cx:200,cy:215,r:28,fill:"#f3b560",stroke:"#7a3a1c","stroke-width":2},dial);
  sv("circle",{cx:200,cy:215,r:5,fill:"#3a1a10"},dial);
  const wv = $("wv"); let i=0;
  for(let a=-100;a<=100;a+=8){ if(Math.abs(a)<17) continue;
    const h=10+((i*7)%4)*4, g=sv("g",{transform:`rotate(${a} 200 215)`},wv);
    const r=sv("rect",{x:198,y:215-150-h,width:4,height:h,rx:2},g); r.style.setProperty("--d",(-(i%7)*0.13).toFixed(2)+"s"); i++; }
  function eq(id,x0,n,w,gap,yb,hmax){ const g=$(id); for(let k=0;k<n;k++){ const h=hmax*(0.55+0.45*(((k*5)%7)/6));
    const r=sv("rect",{x:x0+k*(w+gap),y:yb-h,width:w,height:h,rx:1.5},g); r.style.setProperty("--d",(-(k%5)*0.12-(id.length)*0.03).toFixed(2)+"s"); } }
  eq("eqL",116,4,6,2,384,100); eq("eqR",256,4,6,2,384,100); eq("eqU",158,10,7,1.5,440,22);
})();

let previewOn = false, heroBase = "idle", previewState = null, musicTitle = "", musicDucked = false, toolName = "";
function paintHero(){
  const s = previewState || heroBase, ui = STATE_UI[s] || STATE_UI.idle;
  hero.dataset.state = s;
  $("stIcon").textContent = ui.i; $("stWord").textContent = ui.w;
  let sub = ui.sub;
  if(!previewState){
    if(s==="tool" && toolName) sub = toolName;
    else if(musicTitle) sub = "♪ " + musicTitle + (musicDucked ? " (ducked)" : "");
  } else sub = "animation preview";
  document.querySelectorAll("#previewRow .pbtn[data-st]").forEach(b=>b.setAttribute("aria-pressed", String(!!previewState && b.dataset.st===previewState)));
  $("stSub").textContent = sub;
}
function setHeroState(s){ if(STATE_UI[s]){ heroBase = s; paintHero(); } }
function flashHero(){ hero.classList.remove("flash"); void hero.offsetWidth; hero.classList.add("flash"); setTimeout(()=>hero.classList.remove("flash"), 800); }

/* animation preview: states only, never chat content */
(function(){
  const row = $("previewRow");
  row.appendChild(el("div","pt","Show state"));
  Object.keys(STATE_UI).forEach(k=>{
    const b=el("button","pbtn"); b.dataset.st=k; b.setAttribute("aria-pressed","false");
    b.appendChild(el("i",null,STATE_UI[k].i)); b.appendChild(document.createTextNode(STATE_UI[k].w));
    b.addEventListener("click",()=>{ previewState=k; paintHero(); }); row.appendChild(b); });
  const f=el("button","pbtn fx"); f.appendChild(el("i",null,"⚡")); f.appendChild(document.createTextNode("Barge-in flash")); f.addEventListener("click",flashHero); row.appendChild(f);
  window.setPreview = function(on){
    row.hidden=!on; previewOn=on;
    previewState = on ? (previewState||"listening") : null; paintHero();
  };
  setPreview(true,false);   /* on by default; real events switch it off (see ingest) */
})();

/* ===================== chat feed ===================== */
feed.addEventListener("scroll",()=>{ pinned = feed.scrollTop + feed.clientHeight >= feed.scrollHeight - 40; });
const turns = new Map(), toolRows = new Map();
let emptyEl = null;
function showEmpty(title, text){ clearEmpty(); emptyEl = el("li","empty"); emptyEl.appendChild(el("b",null,title)); emptyEl.appendChild(el("span",null,text)); feed.appendChild(emptyEl); }
function clearEmpty(){ if(emptyEl){ emptyEl.remove(); emptyEl=null; } }
function resetView(){
  feed.textContent=""; turns.clear(); toolRows.clear(); lastSession=null; emptyEl=null; seen.clear();
  heroBase="idle"; musicTitle=""; musicDucked=false; toolName=""; paintHero(); pinned=true;
}
function chip(label, ms){
  const c = el("span","chip"); c.appendChild(document.createTextNode(label+" ")); c.appendChild(el("b",null,sec(ms))); return c;
}
let lastSession = null;
let lastTurnKey = null;
function getTurn(ev){
  const key = (ev.session!=null?ev.session:"s")+"#"+(ev.turn!=null?ev.turn:"0");
  let t = turns.get(key);
  if(!t){ clearEmpty();
    const li = el("li","turn"); li.appendChild(el("div","turnH","Turn "+(ev.turn!=null?ev.turn:"?"))); feed.appendChild(li);
    t = {li, tools:0}; turns.set(key,t); }
  lastTurnKey = key; lastSession = ev.session!=null?ev.session:"s";
  return t;
}
function addRow(t, node){ t.li.appendChild(node); toBottom(); }
function msg(kind, who, text, chips){
  const d = el("div","row msg "+kind); d.appendChild(el("span","who",who)); d.appendChild(document.createTextNode(text));
  if(chips.length){ const c=el("div","chips"); chips.forEach(x=>c.appendChild(x)); d.appendChild(c); } return d;
}
function evt(cls, ic, parts){ const d=el("div","evt "+cls); d.appendChild(el("i","ic",ic)); parts.forEach(p=>d.appendChild(typeof p==="string"?document.createTextNode(p):p)); return d; }
function q(text){ return el("span","q","“"+text+"”"); }

function ingest(ev){
  if(!ev || typeof ev!=="object" || typeof ev.type!=="string") return;
  if(previewOn) setPreview(false);   /* real data always wins over the preview */
  switch(ev.type){
    case "state": setHeroState(ev.state); if(ev.state!=="tool") toolName=""; paintHero(); break;
    case "user": {
      const t = getTurn(ev), chips=[]; if(typeof ev.asr_ms==="number"){ chips.push(chip("ASR final",ev.asr_ms,"asr")); }
      addRow(t, msg("user","You",String(ev.text||""),chips)); break; }
    case "agent": {
      const t = getTurn(ev), chips=[];
      if(typeof ev.llm_ms==="number"){ chips.push(chip("LLM first token",ev.llm_ms,"llm")); }
      if(typeof ev.tts_ms==="number"){ chips.push(chip("TTS first audio",ev.tts_ms,"tts")); }
      if(typeof ev.e2e_ms==="number"){ chips.push(chip("End-to-end",ev.e2e_ms,"e2e"));
        if(t.tools>0){ const c=el("span","chip","tools on"); c.title="This turn called a tool, so it is slower than the tools-off benchmark"; chips.push(c); } }
      addRow(t, msg("agent","Kuya Jukebox",String(ev.text||""),chips)); break; }
    case "tool": {
      const t = getTurn(ev), id = lastTurnKey+":"+ev.name; let r = toolRows.get(id);
      if(ev.phase==="start"){ t.tools++; toolName = ev.name||"tool"; paintHero();
        r = evt("tool","⚙",[ "Tool call ", el("b",null,String(ev.name||"?")), el("span","spin") ]); toolRows.set(id,r); addRow(t,r); }
      else { if(!r){ t.tools++; r = el("div","evt tool"); toolRows.set(id,r); addRow(t,r); }
        r.textContent=""; r.className="evt tool"; r.appendChild(el("i","ic","✓")); r.appendChild(document.createTextNode("Tool "));
        r.appendChild(el("b",null,String(ev.name||"?"))); r.appendChild(document.createTextNode(typeof ev.ms==="number" ? " finished in "+sec(ev.ms) : " finished")); toBottom(); }
      break; }
    case "interrupt": { const t=getTurn(ev); flashHero(); addRow(t, evt("int","⚡",["Interrupted by the user (barge-in)"])); break; }
    case "guard": { const t=getTurn(ev); addRow(t, evt("guard","⏱",["Slow-connection line spoken: ", q(String(ev.line||""))])); break; }
    case "echo_dropped": { const t=getTurn(ev); addRow(t, evt("echo","∅",["Echo filter dropped the agent's own voice: ", q(String(ev.text||""))])); break; }
    case "music": {
      const t = getTurn(ev), a = String(ev.action||"");
      if(a==="play"){ musicTitle = ev.title||"music"; musicDucked=false; } else if(a==="stop"||a==="pause"){ musicTitle=""; musicDucked=false; }
      else if(a==="duck"){ musicDucked=true; } if(ev.title && a!=="stop") musicTitle = ev.title; paintHero();
      addRow(t, evt("music","♫",["Music "+a+(ev.title?": ":""), ev.title?q(String(ev.title)):""])); break; }
  }
}
const seen = new Set();
function ingestFrom(src, ev){
  if(src!==mode) return;                         // never mix live and replay
  if(src==="live"){ const sig=JSON.stringify(ev); if(seen.has(sig)) return; seen.add(sig); if(seen.size>800){ seen.delete(seen.values().next().value); } }
  ingest(ev);
}

/* ===================== connection: LIVE ===================== */
let mode = "live", hostVal = (/^https?:$/.test(location.protocol) && location.hostname && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? location.hostname+":8106" : null) || store("kuya.host") || "192.168.88.8:8106";
try{ const qh = new URLSearchParams(location.search).get("host"); if(qh){ hostVal = qh.replace(/[^\w.:\-\/]/g,""); store("kuya.host",hostVal); } }catch(e){}

function hostUrl(path){ let h=hostVal.trim().replace(/\/+$/,""); if(!/^https?:\/\//i.test(h)) h="http://"+h; return h+path; }
const PILL = {live:"LIVE", reconnecting:"RECONNECTING", replay:"REPLAY", waiting:"WAITING"};
function setStatus(k){
  const cs=$("chatSrc"); cs.dataset.k=k; cs.textContent = k==="live"?"from the Pi, live": k==="replay"?"recorded session": k==="reconnecting"?"connection lost, retrying":"not connected yet";
  $("chatTitle").textContent = k==="replay" ? "Replay (recorded)" : "Live conversation";
  if(!feed.children.length || emptyEl){ if(mode==="live") showEmpty("Waiting for the agent", k==="live" ? "Connected. Nothing said yet." : "Looking for the agent at "+hostVal+". This panel shows only real events from the Pi."); }
}
let abortC=null, retryT=null, everLive=false, backoff=1000;
function stopLive(){ if(abortC){ abortC.abort(); abortC=null; } clearTimeout(retryT); }
function scheduleRetry(){ clearTimeout(retryT); retryT=setTimeout(startLive, backoff); backoff=Math.min(backoff*1.6, 8000); }
async function startLive(){
  if(mode!=="live") return; stopLive(); setStatus(everLive?"reconnecting":"waiting");
  const ac = abortC = new AbortController();
  try{
    const res = await fetch(hostUrl("/events"), {signal:ac.signal, headers:{Accept:"text/event-stream"}, cache:"no-store"});
    if(!res.ok || !res.body) throw new Error("bad response");
    everLive=true; backoff=1000; setStatus("live");
    const rd = res.body.getReader(), dec = new TextDecoder(); let buf="";
    for(;;){ const {done,value}=await rd.read(); if(done) break; buf += dec.decode(value,{stream:true});
      let i; while((i=buf.indexOf("\n"))>=0){ let line=buf.slice(0,i).trim(); buf=buf.slice(i+1);
        if(!line||line[0]===":"||/^(event|id|retry):/.test(line)) continue; if(line.startsWith("data:")) line=line.slice(5).trim();
        try{ ingestFrom("live", JSON.parse(line)); }catch(e){ /* ignore a malformed line */ } } }
  }catch(e){ if(ac.signal.aborted) return; }
  if(mode==="live" && abortC===ac){ setStatus(everLive?"reconnecting":"waiting"); scheduleRetry(); }
}

/* ===================== display options ===================== */

/* ===================== start ===================== */
paintHero(); setStatus("waiting"); startLive();
</script>
</body>
</html>
